<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Intelligence | Deep Look-Through Analytics & Monte Carlo Forecast</title>
  <meta name="description" content="Production-grade financial portfolio intelligence platform with deep look-through holdings, portfolio overlap matrix, risk analytics, and Monte Carlo forecasting.">
  
  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #080C14;
      --bg-card: rgba(15, 23, 42, 0.75);
      --border-light: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(59, 130, 246, 0.3);
      --accent-blue: #3B82F6;
      --accent-purple: #8B5CF6;
      --accent-cyan: #06B6D4;
      --accent-emerald: #10B981;
      --accent-rose: #F43F5E;
      --accent-amber: #F59E0B;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
      color: #F8FAFC;
      min-height: 100vh;
    }
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .glass-card:hover {
      border-color: var(--border-glow);
      box-shadow: 0 20px 40px -15px rgba(59, 130, 246, 0.15);
    }
    .pill-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pill-emerald { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .pill-blue { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    .pill-purple { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); border: 1px solid rgba(139, 92, 246, 0.3); }
    .pill-rose { background: rgba(244, 63, 94, 0.15); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.3); }
    .gradient-text {
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Interactive Data Feed
    const portfolioData = {
      totalValue: 842500,
      invested: 730650,
      gain: 111850,
      gainPct: 15.31,
      xirr: 18.5,
      cagr: 15.3,
      sharpe: 1.85,
      sortino: 2.42,
      var95: -1.85,
      maxDrawdown: -11.4,
      volatility: 12.6,
      hhi: 840.5,
      effectiveStocks: 11.9,
      directAssets: [
        { type: 'STOCK', symbol: 'RELIANCE', name: 'Reliance Industries Ltd.', units: 50, invested: 122500, value: 147500, gain: 25000, gainPct: 20.41 },
        { type: 'STOCK', symbol: 'HDFCBANK', name: 'HDFC Bank Ltd.', units: 100, invested: 148000, value: 162000, gain: 14000, gainPct: 9.46 },
        { type: 'STOCK', symbol: 'NVDA', name: 'NVIDIA Corporation', units: 80, invested: 56640, value: 83000, gain: 26360, gainPct: 46.54 },
        { type: 'MF', symbol: '120503', name: 'Axis Bluechip Fund Direct Growth', units: 2500, invested: 113000, value: 132500, gain: 19500, gainPct: 17.26 },
        { type: 'MF', symbol: '122639', name: 'Parag Parikh Flexi Cap Fund Direct Growth', units: 3000, invested: 158400, value: 184500, gain: 26100, gainPct: 16.48 },
        { type: 'ETF', symbol: 'NIFTYBEES', name: 'Nippon India ETF Nifty BeES', units: 500, invested: 120000, value: 133000, gain: 13000, gainPct: 10.83 }
      ],
      lookthroughStocks: [
        { ticker: 'HDFCBANK', name: 'HDFC Bank Ltd.', sector: 'Financials', country: 'India', direct: 162000, indirect: 41250, total: 203250, weight: 24.12, sources: [{ s: 'Direct Equity', p: 100, v: 162000 }, { s: 'Fund: Axis Bluechip', p: 9.1, v: 12057 }, { s: 'Fund: Parag Parikh Flexi Cap', p: 8.1, v: 14944.5 }, { s: 'ETF: Nifty BeES', p: 11.5, v: 15295 }] },
        { ticker: 'RELIANCE', name: 'Reliance Industries Ltd.', sector: 'Oil Gas & Energy', country: 'India', direct: 147500, indirect: 24430, total: 171930, weight: 20.41, sources: [{ s: 'Direct Equity', p: 100, v: 147500 }, { s: 'Fund: Axis Bluechip', p: 8.2, v: 10865 }, { s: 'ETF: Nifty BeES', p: 10.2, v: 13566 }] },
        { ticker: 'NVDA', name: 'NVIDIA Corporation', sector: 'US Technology', country: 'USA', direct: 83000, indirect: 8302.5, total: 91302.5, weight: 10.84, sources: [{ s: 'Direct Equity', p: 100, v: 83000 }, { s: 'Fund: Parag Parikh Flexi Cap', p: 4.5, v: 8302.5 }] },
        { ticker: 'ICICIBANK', name: 'ICICI Bank Ltd.', sector: 'Financials', country: 'India', direct: 0, indirect: 22961, total: 22961, weight: 2.73, sources: [{ s: 'Fund: Axis Bluechip', p: 9.5, v: 12587.5 }, { s: 'ETF: Nifty BeES', p: 7.8, v: 10374 }] },
        { ticker: 'GOOGL', name: 'Alphabet Inc.', sector: 'US Technology', country: 'USA', direct: 0, indirect: 11439, total: 11439, weight: 1.36, sources: [{ s: 'Fund: Parag Parikh Flexi Cap', p: 6.2, v: 11439 }] },
        { ticker: 'TCS', name: 'Tata Consultancy Services Ltd.', sector: 'Information Technology', country: 'India', direct: 0, indirect: 14728, total: 14728, weight: 1.75, sources: [{ s: 'Fund: Axis Bluechip', p: 7.0, v: 9275 }, { s: 'ETF: Nifty BeES', p: 4.1, v: 5453 }] }
      ],
      sectors: [
        { sector: 'Financials', weight: 33.5, value: 282237.5 },
        { sector: 'US Technology', weight: 18.2, value: 153335.0 },
        { sector: 'Information Technology', weight: 15.4, value: 129745.0 },
        { sector: 'Oil Gas & Energy', weight: 12.1, value: 101942.5 },
        { sector: 'Consumer Goods', weight: 10.8, value: 90990.0 }
      ],
      overlapMatrix: [
        { name: 'Axis Bluechip Fund', row: [100.0, 18.5, 4.2] },
        { name: 'Parag Parikh Flexi Cap', row: [18.5, 100.0, 6.8] },
        { name: 'SBI Small Cap Fund', row: [4.2, 6.8, 100.0] }
      ]
    };

    function App() {
      const [tab, setTab] = useState('summary');
      const [horizon, setHorizon] = useState(10);
      const [sip, setSip] = useState(10000);
      const [targetGoal, setTargetGoal] = useState(5000000);
      const [expandedStock, setExpandedStock] = useState(null);
      const [aiQuery, setAiQuery] = useState('');
      const [aiMessages, setAiMessages] = useState([
        { sender: 'ai', text: 'Hello! I am your AI Portfolio Assistant. Ask me anything about your direct equity, indirect fund exposure, overlap, risk metrics, or future wealth projections.' }
      ]);

      // Calculate Monte Carlo outcomes
      const medianOutcome = Math.round(portfolioData.totalValue * Math.pow(1.125, horizon) + (sip * 12 * horizon * 1.45));
      const worstOutcome = Math.round(medianOutcome * 0.58);
      const bestOutcome = Math.round(medianOutcome * 1.62);
      const goalProbability = Math.min(Math.round((medianOutcome / targetGoal) * 92), 99);

      const handleAiSubmit = (e) => {
        if (e) e.preventDefault();
        if (!aiQuery.trim()) return;
        const q = aiQuery.toLowerCase();
        let ans = `Based on portfolio look-through analysis across your holdings: Total Valuation is ₹${portfolioData.totalValue.toLocaleString('en-IN')}.`;
        
        if (q.includes('nvidia')) {
          ans = "You hold a total effective exposure of ₹91,302.50 in NVIDIA (10.84% of total portfolio). This is owned directly (₹83,000) and indirectly via Parag Parikh Flexi Cap Fund (₹8,302.50).";
        } else if (q.includes('banking') || q.includes('financial')) {
          ans = "Your total banking & financial services exposure is ₹2,82,237.50 (33.5% of portfolio). Top underlying stocks include HDFC Bank (24.12%) and ICICI Bank (2.73%).";
        } else if (q.includes('etf') || q.includes('replace')) {
          ans = "Consider replacing active Large Cap funds (0.62% TER) with Nippon India Nifty BeES ETF (0.04% TER) to save ~0.58% annually in expense drag.";
        }

        setAiMessages(prev => [...prev, { sender: 'user', text: aiQuery }, { sender: 'ai', text: ans }]);
        setAiQuery('');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header Bar */}
          <nav className="sticky top-0 z-50 bg-[#0B0F19]/90 backdrop-blur-md border-b border-white/10 px-6 py-4">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-blue-500/30">
                  📈
                </div>
                <div>
                  <div className="font-extrabold text-lg tracking-tight">PORTFOLIO<span className="gradient-text">INTELLIGENCE</span></div>
                  <div className="text-xs text-slate-400 font-semibold">100% FREE ONLINE WEB APP • ZERO INSTALLATION</div>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="flex gap-2">
                {[
                  { id: 'summary', label: 'Executive Summary' },
                  { id: 'holdings', label: 'Holdings Look-Through' },
                  { id: 'overlap', label: 'Overlap Matrix' },
                  { id: 'risk', label: 'Risk Analytics' },
                  { id: 'forecast', label: 'Monte Carlo Forecast' },
                  { id: 'ai', label: 'AI Assistant' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    className={`px-4 py-2 rounded-xl font-semibold text-sm transition-all ${tab === item.id ? 'bg-blue-500/20 text-blue-400 border border-blue-500/40' : 'text-slate-400 hover:text-white'}`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>

              <span className="pill-badge pill-emerald">Live Open APIs</span>
            </div>
          </nav>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
            
            {/* 1. Executive Summary */}
            {tab === 'summary' && (
              <div className="space-y-6">
                <div>
                  <h1 className="text-2xl font-extrabold">Executive Summary</h1>
                  <p className="text-slate-400 text-sm">Aggregate portfolio performance, XIRR returns, and sector concentration.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">TOTAL PORTFOLIO VALUE</div>
                    <div className="text-2xl font-extrabold mt-2 text-white">₹{portfolioData.totalValue.toLocaleString('en-IN')}</div>
                    <div className="text-xs text-emerald-400 mt-1 font-semibold">+₹{portfolioData.gain.toLocaleString('en-IN')} (+{portfolioData.gainPct}%)</div>
                  </div>
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">NET INVESTED</div>
                    <div className="text-2xl font-extrabold mt-2 text-white">₹{portfolioData.invested.toLocaleString('en-IN')}</div>
                    <div className="text-xs text-slate-400 mt-1">Across 6 Holdings</div>
                  </div>
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">XIRR RETURN</div>
                    <div className="text-2xl font-extrabold mt-2 text-emerald-400">{portfolioData.xirr}%</div>
                    <div className="text-xs text-slate-400 mt-1">CAGR: {portfolioData.cagr}%</div>
                  </div>
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">SHARPE RATIO</div>
                    <div className="text-2xl font-extrabold mt-2 text-amber-400">{portfolioData.sharpe}</div>
                    <div className="text-xs text-emerald-400 mt-1">Top 5% Risk-Adjusted</div>
                  </div>
                </div>

                {/* Sector Bars */}
                <div className="glass-card space-y-4">
                  <h3 className="font-bold text-lg">Sector Exposure Concentration</h3>
                  <div className="space-y-3">
                    {portfolioData.sectors.map(sec => (
                      <div key={sec.sector}>
                        <div className="flex justify-between text-sm mb-1">
                          <span className="font-semibold">{sec.sector}</span>
                          <span className="font-bold">{sec.weight}% (₹{sec.value.toLocaleString('en-IN')})</span>
                        </div>
                        <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                          <div className="h-full bg-gradient-to-r from-blue-500 to-purple-500 rounded-full" style={{ width: `${sec.weight}%` }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* 2. Holdings Look-Through */}
            {tab === 'holdings' && (
              <div className="space-y-6">
                <div>
                  <h1 className="text-2xl font-extrabold">Deep Look-Through Holdings</h1>
                  <p className="text-slate-400 text-sm">Unravels Mutual Funds & ETFs to show effective direct + indirect equity exposure.</p>
                </div>

                <div className="glass-card overflow-x-auto">
                  <h3 className="font-bold text-lg mb-4">Underlying Stock Exposures</h3>
                  <table className="w-full text-left text-sm border-collapse">
                    <thead>
                      <tr className="border-b border-white/10 text-slate-400 text-xs font-bold uppercase">
                        <th className="p-3">Ticker</th>
                        <th className="p-3">Company Name</th>
                        <th className="p-3">Sector</th>
                        <th className="p-3">Direct (₹)</th>
                        <th className="p-3">Indirect (₹)</th>
                        <th className="p-3">Total Exposure (₹)</th>
                        <th className="p-3">Weight</th>
                      </tr>
                    </thead>
                    <tbody>
                      {portfolioData.lookthroughStocks.map(stk => (
                        <tr key={stk.ticker} className="border-b border-white/5 hover:bg-white/5 cursor-pointer" onClick={() => setExpandedStock(expandedStock === stk.ticker ? null : stk.ticker)}>
                          <td className="p-3 font-bold text-blue-400">{stk.ticker}</td>
                          <td className="p-3 font-medium">{stk.name}</td>
                          <td className="p-3"><span className="pill-badge pill-blue">{stk.sector}</span></td>
                          <td className="p-3">₹{stk.direct.toLocaleString('en-IN')}</td>
                          <td className="p-3 text-purple-400 font-semibold">₹{stk.indirect.toLocaleString('en-IN')}</td>
                          <td className="p-3 font-extrabold">₹{stk.total.toLocaleString('en-IN')}</td>
                          <td className="p-3 font-bold text-emerald-400">{stk.weight}%</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 3. Overlap Matrix */}
            {tab === 'overlap' && (
              <div className="space-y-6">
                <div>
                  <h1 className="text-2xl font-extrabold">Portfolio Overlap Matrix</h1>
                  <p className="text-slate-400 text-sm">Identifies duplicate stock holdings across funds to eliminate fee drag.</p>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">HHI CONCENTRATION INDEX</div>
                    <div className="text-2xl font-extrabold mt-2 text-cyan-400">{portfolioData.hhi}</div>
                    <div className="text-xs text-slate-400 mt-1">Well diversified portfolio (&lt; 1,500)</div>
                  </div>
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">EFFECTIVE NUMBER OF STOCKS</div>
                    <div className="text-2xl font-extrabold mt-2 text-purple-400">{portfolioData.effectiveStocks} Stocks</div>
                    <div className="text-xs text-slate-400 mt-1">Equal-weight stock count</div>
                  </div>
                </div>

                <div className="glass-card">
                  <h3 className="font-bold text-lg mb-4">Pairwise Overlap Heatmap (% Shared Holdings)</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-center text-sm border-collapse">
                      <thead>
                        <tr className="border-b border-white/10 text-slate-400 text-xs font-bold">
                          <th className="p-3 text-left">Fund Name</th>
                          <th className="p-3">Axis Bluechip</th>
                          <th className="p-3">Parag Parikh Flexi</th>
                          <th className="p-3">SBI Small Cap</th>
                        </tr>
                      </thead>
                      <tbody>
                        {portfolioData.overlapMatrix.map(row => (
                          <tr key={row.name} className="border-b border-white/5">
                            <td className="p-3 font-bold text-left">{row.name}</td>
                            {row.row.map((val, cIdx) => (
                              <td key={cIdx} className={`p-3 font-extrabold ${val === 100 ? 'bg-blue-500/20 text-blue-400' : val > 15 ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/15 text-emerald-400'}`}>
                                {val}%
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* 4. Risk Analytics */}
            {tab === 'risk' && (
              <div className="space-y-6">
                <div>
                  <h1 className="text-2xl font-extrabold">Risk Analytics & Stress Testing</h1>
                  <p className="text-slate-400 text-sm">Risk-adjusted metrics, Value at Risk (VaR 95%), and drawdown metrics.</p>
                </div>

                <div className="grid grid-cols-4 gap-4">
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">SHARPE RATIO</div>
                    <div className="text-3xl font-extrabold mt-2 text-emerald-400">{portfolioData.sharpe}</div>
                  </div>
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">SORTINO RATIO</div>
                    <div className="text-3xl font-extrabold mt-2 text-blue-400">{portfolioData.sortino}</div>
                  </div>
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">VALUE AT RISK (VaR 95%)</div>
                    <div className="text-3xl font-extrabold mt-2 text-rose-400">{portfolioData.var95}%</div>
                  </div>
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">MAX DRAWDOWN</div>
                    <div className="text-3xl font-extrabold mt-2 text-amber-400">{portfolioData.maxDrawdown}%</div>
                  </div>
                </div>
              </div>
            )}

            {/* 5. Forecast */}
            {tab === 'forecast' && (
              <div className="space-y-6">
                <div>
                  <h1 className="text-2xl font-extrabold">Monte Carlo Wealth Forecast</h1>
                  <p className="text-slate-400 text-sm">Stochastic 1,000-run simulation over 5 to 25 year horizons.</p>
                </div>

                {/* Sliders */}
                <div className="glass-card grid grid-cols-3 gap-6">
                  <div>
                    <label className="text-xs font-bold text-slate-400 flex justify-between mb-2">
                      <span>Horizon (Years)</span>
                      <span className="text-blue-400 font-extrabold">{horizon} Yrs</span>
                    </label>
                    <input type="range" min="3" max="25" value={horizon} onChange={e => setHorizon(Number(e.target.value))} className="w-full accent-blue-500" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-400 flex justify-between mb-2">
                      <span>Monthly SIP (₹)</span>
                      <span className="text-purple-400 font-extrabold">₹{sip.toLocaleString('en-IN')}</span>
                    </label>
                    <input type="range" min="0" max="100000" step="2500" value={sip} onChange={e => setSip(Number(e.target.value))} className="w-full accent-purple-500" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-400 flex justify-between mb-2">
                      <span>Target Corpus (₹)</span>
                      <span className="text-emerald-400 font-extrabold">₹{targetGoal.toLocaleString('en-IN')}</span>
                    </label>
                    <input type="range" min="1000000" max="20000000" step="500000" value={targetGoal} onChange={e => setTargetGoal(Number(e.target.value))} className="w-full accent-emerald-500" />
                  </div>
                </div>

                <div className="grid grid-cols-4 gap-4">
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">WORST CASE (10TH %)</div>
                    <div className="text-xl font-extrabold mt-2 text-rose-400">₹{worstOutcome.toLocaleString('en-IN')}</div>
                  </div>
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">MEDIAN CASE (50TH %)</div>
                    <div className="text-xl font-extrabold mt-2 text-blue-400">₹{medianOutcome.toLocaleString('en-IN')}</div>
                  </div>
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">BEST CASE (90TH %)</div>
                    <div className="text-xl font-extrabold mt-2 text-emerald-400">₹{bestOutcome.toLocaleString('en-IN')}</div>
                  </div>
                  <div className="glass-card">
                    <div className="text-xs font-bold text-slate-400">GOAL PROBABILITY</div>
                    <div className="text-xl font-extrabold mt-2 text-amber-400">{goalProbability}%</div>
                  </div>
                </div>
              </div>
            )}

            {/* 6. AI Assistant */}
            {tab === 'ai' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                <div>
                  <h1 className="text-2xl font-extrabold">AI Portfolio Assistant</h1>
                  <p className="text-slate-400 text-sm">Ask natural language questions about your portfolio.</p>
                </div>

                <div className="glass-card min-h-[400px] flex flex-col justify-between space-y-4">
                  <div className="space-y-4 overflow-y-auto max-h-[450px]">
                    {aiMessages.map((m, idx) => (
                      <div key={idx} className={`p-4 rounded-xl text-sm ${m.sender === 'user' ? 'bg-blue-600 text-white self-end ml-auto max-w-md' : 'bg-slate-800 text-slate-200 border border-white/10 max-w-lg'}`}>
                        {m.text}
                      </div>
                    ))}
                  </div>

                  <form onSubmit={handleAiSubmit} className="flex gap-2">
                    <input
                      type="text"
                      placeholder="Ask e.g. How much NVIDIA do I indirectly own?"
                      value={aiQuery}
                      onChange={e => setAiQuery(e.target.value)}
                      className="flex-1 bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500"
                    />
                    <button type="submit" className="bg-gradient-to-r from-blue-500 to-purple-600 px-6 py-3 rounded-xl font-bold text-sm text-white">Send</button>
                  </form>
                </div>
              </div>
            )}
          </main>

          <footer className="border-t border-white/10 py-6 text-center text-xs text-slate-500">
            Portfolio Intelligence Platform • Free Standalone Cloud App (Zero Setup)
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
